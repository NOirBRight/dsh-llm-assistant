# 助理：一个不属于任何 workspace 的常驻 Agent，外加 shell.overlay 上的一个席位。
# schedule 必须先于助理插入：工具只装给加载之后创建/恢复的 root Agent。
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
      config:
        maxReferences: 3
        maxReferenceBytes: 16384
    - id: llm-assistant
      name: 'dsh-llm-assistant'
