# Plugin-private assistant composition. Not a roster root — the main-window
# picker never lists this directory. dsh-llm-assistant mounts the same rows
# onto a standing scope it owns and parents each assistant Agent onto it.
#
# Keep in sync with src/assistant-preset.ts ASSISTANT_PRESET_ROWS.

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
